name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: lint + unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"

  integration:
    name: integration (Postgres 16, real outages)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pghadr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pghadr_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHADR_TEST_DSN: postgresql://postgres:postgres@localhost:5432/pghadr_test
      PGHADR_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      PGHADR_DSN: postgresql://postgres:postgres@localhost:5432/pghadr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m integration -v
      - name: CLI smoke test (a real restart of the Postgres container)
        run: |
          pghadr init
          pghadr probe --seconds 3
          pghadr cost --replicas 1 --hours 3
          pghadr drill --action command \
            --command "docker restart ${{ job.services.postgres.id }}" \
            --warmup 5 --settle 5 --out-dir ci-runs --name ci-restart
          cat ci-runs/ci-restart.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-restart-drill
          path: ci-runs/
          if-no-files-found: ignore

  bicep:
    name: bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
