# Local Postgres for the offline drill and the integration tests.
#   docker compose up -d
#   export PGHADR_DSN=postgresql://postgres:postgres@localhost:5432/pghadr_test
#   pghadr drill --action command --command "docker restart pghadr-pg" --warmup 10 --settle 10
services:
  postgres:
    image: postgres:16
    container_name: pghadr-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pghadr_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pghadr_test"]
      interval: 2s
      timeout: 3s
      retries: 30
