[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pghadr"
version = "0.1.0"
description = "Measure, don't assume: HA failover and cross-region DR drills for Azure Database for PostgreSQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sharath Chandra Kampili" }]
keywords = ["postgres", "azure", "high-availability", "disaster-recovery", "failover", "rpo", "rto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pghadr = "pghadr.cli:main"

[project.urls]
Homepage = "https://github.com/sharath568/azure-data-pg-hadr"
Issues = "https://github.com/sharath568/azure-data-pg-hadr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pghadr"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "pghadr/sql"

[tool.hatch.build.targets.sdist]
include = ["src/pghadr", "sql", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (set PGHADR_TEST_DSN and PGHADR_TEST_ADMIN_DSN)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
